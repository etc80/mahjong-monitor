name: Mahjong Calendar Monitor

on:
  workflow_dispatch:

  schedule:
    # 09:00 UTC
    - cron: '0 9 * * *'

    # 21:00 UTC
    - cron: '0 21 * * *'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check website
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          python - <<'PY'
          import urllib.request
          import urllib.parse
          import re
          import os
          import subprocess
          import sys

          URL = "http://mahjong-europe.org/ranking/Calendar.html"
          TARGET = "Graz Riichi Open 2026"
          STATE_FILE = "state.txt"

          print("Opening:", URL)

          request = urllib.request.Request(
              URL,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              html = response.read().decode("utf-8", errors="replace")

          print("Downloaded:", len(html), "bytes")

          # Ищем строку календаря, содержащую нужный турнир.
          pattern = re.compile(
              r'<p[^>]*class=["\']contenuCelluleG["\'][^>]*>'
              r'(.*?)'
              r'</p>',
              re.IGNORECASE | re.DOTALL
          )

          match = None

          for m in pattern.finditer(html):
              if TARGET in m.group(1):
                  match = m
                  break

          if match is None:
              print("Tournament not found")
              sys.exit(0)

          element = match.group(1)

          print("Tournament element:")
          print(element.strip())

          # Ищем ссылку, содержащую название турнира.
          link_match = re.search(
              r'<a\b[^>]*href\s*=\s*["\']([^"\']+)["\'][^>]*>'
              r'\s*'
              + re.escape(TARGET) +
              r'\s*'
              r'</a>',
              element,
              re.IGNORECASE | re.DOTALL
          )

          # Ссылки пока нет — просто завершаем работу.
          if not link_match:
              print("RESULT: NOT A LINK")
              sys.exit(0)

          href = link_match.group(1)

          # Если ссылка относительная — превращаем её в абсолютную.
          absolute_url = urllib.parse.urljoin(URL, href)

          print("RESULT: LINK FOUND")
          print("URL:", absolute_url)

          # Проверяем, отправляли ли мы уже уведомление
          # об этой ссылке.
          previous_state = ""

          if os.path.exists(STATE_FILE):
              with open(STATE_FILE, "r", encoding="utf-8") as f:
                  previous_state = f.read().strip()

          if previous_state == absolute_url:
              print("Notification already sent.")
              sys.exit(0)

          # Новая ссылка — отправляем Telegram.
          print("NEW LINK DETECTED!")

          bot_token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          message = (
              "🔔 Graz Riichi Open 2026 теперь доступен по ссылке!\n\n"
              + absolute_url
          )

          telegram_url = (
              "https://api.telegram.org/bot"
              + bot_token
              + "/sendMessage"
          )

          data = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": message
          }).encode()

          telegram_request = urllib.request.Request(
              telegram_url,
              data=data,
              method="POST"
          )

          with urllib.request.urlopen(
              telegram_request,
              timeout=30
          ) as response:
              telegram_response = response.read().decode()

          print("Telegram response:", telegram_response)

          # Запоминаем URL, чтобы повторно не уведомлять.
          with open(STATE_FILE, "w", encoding="utf-8") as f:
              f.write(absolute_url)

          # Сохраняем состояние в Git.
          subprocess.run(
              ["git", "config", "user.name", "github-actions[bot]"],
              check=True
          )

          subprocess.run(
              [
                  "git",
                  "config",
                  "user.email",
                  "41898282+github-actions[bot]@users.noreply.github.com"
              ],
              check=True
          )

          subprocess.run(
              ["git", "add", STATE_FILE],
              check=True
          )

          result = subprocess.run(
              [
                  "git",
                  "commit",
                  "-m",
                  "Save detected link"
              ],
              capture_output=True,
              text=True
          )

          if result.returncode == 0:
              subprocess.run(
                  ["git", "push"],
                  check=True
              )

              print("State saved.")
          else:
              print("State was not changed.")
          PY
