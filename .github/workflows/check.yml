name: Check Mahjong website

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check website
        run: |
          python - <<'PY'
          import urllib.request
          import re
          import sys

          url = "http://mahjong-europe.org/ranking/Calendar.html"
          target = "Graz Riichi Open 2026"

          print("Opening:", url)

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              html = response.read().decode("utf-8", errors="replace")

          print("Downloaded:", len(html), "bytes")

          # Ищем элемент <p class="contenuCelluleG">,
          # содержащий нужный турнир.
          pattern = re.compile(
              r'<p[^>]*class=["\']contenuCelluleG["\'][^>]*>'
              r'(.*?)'
              r'</p>',
              re.IGNORECASE | re.DOTALL
          )

          match = None

          for m in pattern.finditer(html):
              if target in m.group(1):
                  match = m
                  break

          if match is None:
              print("ERROR: Tournament not found")
              sys.exit(1)

          element = match.group(1)

          print()
          print("Tournament element:")
          print("--------------------------------")
          print(element.strip())
          print("--------------------------------")

          # Проверяем наличие ссылки непосредственно внутри элемента.
          link_match = re.search(
              r'<a\b[^>]*>.*?'
              + re.escape(target) +
              r'.*?</a>',
              element,
              re.IGNORECASE | re.DOTALL
          )

          if link_match:
              link = link_match.group(0)

              print()
              print("RESULT: LINK FOUND")
              print("Link:")
              print(link.strip())
          else:
              print()
              print("RESULT: NOT A LINK")
          PY
